<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "LibSerif";
      src: url("file:///usr/share/fonts/truetype/liberation/LiberationSerif-Bold.ttf") format("truetype");
      font-weight: 700;
    }
    @font-face {
      font-family: "LibSans";
      src: url("file:///usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf") format("truetype");
      font-weight: 400;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 264px; overflow: hidden; background: #14120f; }
    .stage { position: relative; width: 1200px; height: 264px; overflow: hidden; background: #14120f; }
    .bg {
      position: absolute;
      inset: -40px;
      background: url("hero.jpg") 58% 38% / cover no-repeat;
      filter: blur(18px) brightness(0.36) saturate(0.9);
    }
    .hero {
      position: absolute;
      top: -28px;
      left: 340px;
      height: 340px;
      width: 920px;
      object-fit: cover;
      object-position: 48% 34%;
      -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 10%, #000 76%, transparent 100%);
      mask-image: linear-gradient(to right, transparent 0%, #000 10%, #000 76%, transparent 100%);
    }
    .glow-l {
      position: absolute; left: -5%; top: -20%; width: 50%; height: 140%;
      background: radial-gradient(ellipse at 25% 50%, rgba(58,122,136,0.38) 0%, rgba(58,122,136,0) 70%);
    }
    .glow-r {
      position: absolute; right: -8%; top: -20%; width: 46%; height: 140%;
      background: radial-gradient(ellipse at 80% 50%, rgba(196,92,62,0.36) 0%, rgba(196,92,62,0) 70%);
    }
    .scrim {
      position: absolute; inset: 0;
      background:
        linear-gradient(to right, rgba(20,18,15,0.82) 0%, rgba(20,18,15,0.55) 24%, rgba(20,18,15,0.12) 48%, transparent 66%),
        linear-gradient(to bottom, rgba(20,18,15,0.08) 0%, transparent 45%, rgba(20,18,15,0.58) 100%);
    }
    .lockup {
      position: absolute;
      left: 44px;
      top: 38px;
      width: 520px;
      z-index: 5;
    }
    .lockup h1 {
      font-family: "LibSerif", "Liberation Serif", Georgia, serif;
      font-weight: 700;
      font-size: 44px;
      line-height: 1;
      color: #f4ecdc;
      letter-spacing: 0.05em;
      white-space: nowrap;
      text-shadow:
        0 1px 0 rgba(244,236,220,0.2),
        0 2px 8px #14120f,
        0 8px 22px rgba(20,18,15,0.95);
    }
    .lockup h1 .amp { color: #c45c3e; padding: 0 0.06em; }
    .tag {
      margin-top: 8px;
      font-family: "LibSans", "Liberation Sans", sans-serif;
      font-size: 12px;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: #f4ecdc;
      text-shadow: 0 2px 8px #14120f;
    }
    .tag .t { color: #3a7a88; }
    .tag .f { color: #c45c3e; }
    .tag .dot { color: #6f7d52; padding: 0 0.35em; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="bg"></div>
    <div class="glow-l"></div>
    <div class="glow-r"></div>
    <img class="hero" src="hero.jpg" alt="" />
    <div class="scrim"></div>
    <div class="lockup">
      <h1>Osea <span class="amp">&</span> Lois</h1>
      <div class="tag"><span class="f">Fire</span><span class="dot">·</span><span class="t">Water</span></div>
    </div>
  </div>
</body>
</html>
