<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "LibSerif";
      src: url("file:///usr/share/fonts/truetype/liberation/LiberationSerif-Bold.ttf") format("truetype");
      font-weight: 700;
    }
    @font-face {
      font-family: "LibSans";
      src: url("file:///usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf") format("truetype");
      font-weight: 400;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: #14120f; }
    .stage { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #14120f; }
    .bg {
      position: absolute;
      inset: -80px;
      background: url("hero.jpg") center 42% / cover no-repeat;
      filter: blur(28px) brightness(0.38) saturate(0.85);
      transform: scale(1.08);
    }
    .glow-l {
      position: absolute; left: -8%; top: 8%; width: 48%; height: 90%;
      background: radial-gradient(ellipse at 30% 55%, rgba(58,122,136,0.42) 0%, rgba(58,122,136,0) 68%);
      pointer-events: none;
    }
    .glow-r {
      position: absolute; right: -8%; top: 8%; width: 48%; height: 90%;
      background: radial-gradient(ellipse at 70% 55%, rgba(196,92,62,0.40) 0%, rgba(196,92,62,0) 68%);
      pointer-events: none;
    }
    .hero {
      position: absolute;
      top: 72px; left: 50%;
      height: 720px; width: 720px;
      transform: translateX(-50%);
      object-fit: cover;
      object-position: center 42%;
      -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 16%, #000 84%, transparent 100%);
      mask-image: linear-gradient(to right, transparent 0%, #000 16%, #000 84%, transparent 100%);
    }
    .vignette {
      position: absolute; inset: 0;
      background:
        linear-gradient(to bottom, rgba(20,18,15,0.35) 0%, transparent 22%, transparent 72%, rgba(20,18,15,0.55) 100%),
        linear-gradient(to right, rgba(20,18,15,0.28) 0%, transparent 22%, transparent 78%, rgba(20,18,15,0.28) 100%);
      pointer-events: none;
    }
    .lockup {
      position: absolute;
      left: 50%;
      top: 36px;
      transform: translateX(-50%);
      width: 680px;
      text-align: center;
      z-index: 5;
    }
    .lockup h1 {
      font-family: "LibSerif", "Liberation Serif", Georgia, serif;
      font-weight: 700;
      font-size: 48px;
      line-height: 0.92;
      color: #f4ecdc;
      letter-spacing: 0.07em;
      text-shadow:
        0 1px 0 rgba(244,236,220,0.25),
        0 2px 8px #14120f,
        0 10px 28px rgba(20,18,15,0.95),
        0 0 36px rgba(20,18,15,0.9);
    }
    .lockup h1 .amp { color: #c45c3e; padding: 0 0.08em; }
    .tag {
      margin-top: 12px;
      font-family: "LibSans", "Liberation Sans", sans-serif;
      font-size: 13px;
      letter-spacing: 0.46em;
      text-transform: uppercase;
      color: #f4ecdc;
      opacity: 0.88;
      text-shadow: 0 2px 10px #14120f, 0 0 18px #14120f;
    }
    .tag .t { color: #3a7a88; }
    .tag .f { color: #c45c3e; }
    .tag .dot { color: #6f7d52; padding: 0 0.4em; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="bg"></div>
    <div class="glow-l"></div>
    <div class="glow-r"></div>
    <img class="hero" src="hero.jpg" alt="" />
    <div class="vignette"></div>
    <div class="lockup">
      <h1>Osea<br><span class="amp">&</span> Lois</h1>
      <div class="tag"><span class="f">Fire</span><span class="dot">·</span><span class="t">Water</span></div>
    </div>
  </div>
</body>
</html>
